<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — News In Green</title>
   
    
    <link rel="stylesheet" href="news.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="home.html" class="brand">
                <span class="brand-mark">N</span>
                <span class="brand-text">News <em>In Green</em></span>
            </a>
            <nav class="main-nav" aria-label="Primary">
                <a href="home.html">Home</a>
                <a href="user-dashboard.html">Dashboard</a>
                <a href="browse.html">Browse</a>
                <a href="bookmarks.html">Bookmarks</a>
                <a href="submit.html">Submit an article</a>
                <a href="help.html">Help & Support</a>
            </nav>
            <div class="header-actions">
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode"
                    aria-pressed="false">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                    <span class="toggle-label">Night</span>
                </button>
            </div>
            <button class="nav-burger" id="nav-burger" aria-label="Open menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main class="auth-main">
        <form class="auth-card" id="login-form" novalidate>
            <h1>Welcome back</h1>
            

            <label for="email"><b>Email</b></label>
            <input type="email" id="email" autocomplete="email" placeholder="name@nsbm.ac.lk" required>

            <label for="password"><b>Password</b></label>
            <input type="password" id="password" autocomplete="current-password"
                placeholder="........" required>

            <p class="form-error" id="form-error" role="alert" hidden></p>

            <button type="submit" class="btn btn-solid btn-full">Log in</button>

            <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
        </form>
    </main>

    <footer class="site-footer">
  
        <div class="footer-bottom">
            <span>&copy; 2026 News In Green</span>
        </div>
    </footer>

    <script src="home.js"></script>
    <script src="login.js"></script>
    <script src="home.js"></script>
    <script src="login.js"></script>
</body>


</html>
