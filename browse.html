<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse Articles - News In Green</title>

    <link rel="stylesheet" href="browse.css">
</head>

<body>

    

    <header class="site-header">
        <div class="header-inner">

            <a href="news.html" class="brand">
                <span class="brand-mark">N</span>
                <span class="brand-text">
                    News <em>In Green</em>
                </span>
            </a>

            <nav class="main-nav" aria-label="Primary">
                <a href="news.html">Home</a>
                <a href="user-dashboard.html">Dashboard</a>
                <a href="browse.html" class="active">Browse</a>
                <a href="bookmarks.html">Bookmarks</a>
                <a href="submit.html">Submit an article</a>
                <a href="sub.html">subscription</a>
                <a href="help.html">contact & help </a>
            </nav>

            <div class="header-actions">

                <button id="theme-toggle"
                    class="theme-toggle"
                    type="button"
                    aria-label="Switch to light mode"
                    aria-pressed="false">

                    <span class="toggle-track">
                        <span class="toggle-thumb"></span>
                    </span>

                    <span class="toggle-label">Night</span>

                </button>

                <a href="#" id="logout-link" class="btn btn-ghost">Log out</a>

            </div>

            <button class="nav-burger"
                id="nav-burger"
                aria-label="Open menu"
                aria-expanded="false">

                <span></span>
                <span></span>
                <span></span>

            </button>

        </div>
    </header>
    <main class="browse-page">

        <section class="browse-container">

            <div class="browse-heading">

                <div>
                    <h1>Browse articles</h1>

                    <p>
                        Filter by category, or search across every approved
                        article on the portal.
                    </p>
                </div>

            </div>
              <div class="category-filter">

                <button class="category-btn active" data-category="All">
                    All
                </button>

                <button class="category-btn" data-category="Academic">
                    Academic
                </button>

                <button class="category-btn" data-category="Events">
                    Events
                </button>

                <button class="category-btn" data-category="Sports">
                    Sports
                </button>

                <button class="category-btn" data-category="General">
                    General
                </button>

            </div>
            <div class="filter-area">

                <div class="search-box">

                    <input
                        type="text"
                        id="search-input"
                        placeholder="Search articles"
                        aria-label="Search articles">

                </div>


                <div class="date-filter">

                    <label for="from-date">
                        From
                    </label>

                    <input
                        type="date"
                        id="from-date">
         To
                    </label>

                    <input
                        type="date"
                        id="to-date">

                    <button
                        type="button"
                        id="filter-btn">
                        Filter
                    </button>

                </div>

            </div>
                    <label for="to-date">


            <section class="results-section">

                <h2>Results</h2>

                <div id="articles-container" class="articles-container">
                    
                </div>

                <div id="empty-message" class="empty-message">
                    No articles yet — check back soon.
                </div>

            </section>


            <div class="pagination">

                <button id="previous-btn" disabled>
                    Previous
                </button>

                <span>
                    Page <strong id="page-number">1</strong>
                </span>

                <button id="next-btn" disabled>
                    Next
                </button>

            </div>

        </section>

    </main>
