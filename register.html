        rel="stylesheet">
    <link rel="stylesheet" href="register.css">
    <script src="register.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="home.php" class="brand"><span class="brand-mark">N</span><span class="brand-text">News <em>In
                        Green</em></span></a>
            <nav class="main-nav" id="main-nav" aria-label="Primary navigation">
                <a href="home.php">Home</a>
                <a href="user-dashboard.html">Dashboard</a>
                <a href="browse.html">Browse</a>
                <a href="bookmarks.html">Bookmarks</a>
                <a href="submit.html">Submit an article</a>
                <a href="help.html">Help &amp; Support</a>
            </nav>
            <div class="header-actions">
                <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to Night Mode"
                    aria-pressed="false">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                    <span class="toggle-label">Day</span>
                </button>
            </div>
            <button type="button" class="nav-burger" id="nav-burger" aria-label="Open menu" aria-controls="main-nav"
                aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>
    <main class="auth-main">
        <form class="auth-card" id="register-form" novalidate>
            <h1>Create your account</h1>
            <p class="sub">Registration is open to current students.</p>
            <label for="full-name">Full name</label>
            <input id="full-name" name="full_name" type="text" autocomplete="name" placeholder="Full-Name" required>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="name@nsbm.ac.lk" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8"
                placeholder="At least 8 characters" required>
            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" type="password" autocomplete="new-password" minlength="8"
                placeholder="Re-enter your password" required>
            <p class="form-error" id="form-error" role="alert" hidden></p>
            <p class="form-success" id="form-success" role="status" hidden></p>
            <button class="btn btn-solid btn-full" type="submit">Create account</button>
            <p class="auth-switch">Already registered? <a href="login.html">Log in</a></p>
        </form>
    </main>
    <footer class="site-footer">
        <div class="footer-bottom">&copy; 2026 News In Green</div>
    </footer>
</body>

</html>
