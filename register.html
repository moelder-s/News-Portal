<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — News In Green</title>
    
    <link rel="stylesheet" href="news.css">
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="home.html" class="brand">
                <span class="brand-mark">N</span>
                <span class="brand-text">News <em>In Green</em></span>
            </a>
            <nav class="main-nav" aria-label="Primary">
                <a href="home.html">Home</a>
                <a href="user-dashboard.html">Dashboard</a>
                <a href="browse.html">Browse</a>
                <a href="bookmarks.html">Bookmarks</a>
                <a href="submit.html">Submit an article</a>
                <a href="help.html">Help & Support</a>
            </nav>
            <div class="header-actions">
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode"
                    aria-pressed="false">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                    <span class="toggle-label">Night</span>
                </button>
            </div>
            <button class="nav-burger" id="nav-burger" aria-label="Open menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main class="auth-main">
        <form class="auth-card" id="register-form" novalidate>
            <h1>Create your account</h1>
            <p class="sub">Registration is open to current students.</p>

            <label for="full-name">Full name</label>
            <input type="text" id="full-name" autocomplete="name" placeholder="Full-Name" required>

            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" placeholder="name@nsbm.ac.lk" required>

            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="new-password" placeholder="At least 8 characters"
                required minlength="8">

            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" autocomplete="new-password"
                placeholder="Re-enter your password" required minlength="8">

            <p class="form-error" id="form-error" role="alert" hidden></p>
            <p class="form-success" id="form-success" role="status" hidden></p>

            <button type="submit" class="btn btn-solid btn-full">Create account</button>

            <p class="auth-switch">Already registered? <a href="login.html">Log in</a></p>
        </form>
    </main>

    <footer class="site-footer">
        </div>
        <div class="footer-bottom">
            <span>&copy; 2026 News In Green</span>
        </div>
    </footer>

    <script src="news.js"></script>
    <script src="register.js"></script>
</body>

</html>
