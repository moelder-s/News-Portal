<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categories — News In Green Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="categories.css" />
</head>
<body>

  <canvas id="sky"></canvas>

  <header class="topbar">
    <div class="brand">
      <span class="logo">N</span>
      <span class="brand-name">News <em>In Green</em></span>
      <span class="page-title"><i class="dot"></i>Categories</span>
    </div>

    <div class="actions">
      <button class="chip" id="logoutBtn">Log out</button>

      <button class="theme-toggle" id="themeToggle" aria-label="Toggle day / night">
        <span class="knob"></span>
        <span class="label" id="themeLabel">Day</span>
      </button>

      <a class="chip home" href="#">Home</a>

      <div class="profile">
        <span class="avatar">A</span>
        <span>Admin</span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="glass-card">
      <div class="card-head">
        <h2>News categories</h2>
        <button class="btn-new" id="addBtn">+ New category</button>
      </div>

      <table>
        <thead>
          <tr><th>Name</th><th>Articles</th><th></th></tr>
        </thead>
        <tbody id="catBody"></tbody>
      </table>
    </section>
  </main>

  <script src="categories.js" defer></script>
</body>
</html>
