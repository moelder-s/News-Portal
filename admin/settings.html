<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — News In Green Admin</title>

    <link rel="stylesheet" href="settings.css">
    <script src="settings.js" defer></script>
</head>

<body class="day">

    <!-- HEADER -->
    <header class="topbar">
        <div class="brand">
            <span class="logo">N</span>
            <span>News <em>In Green</em></span>
            <span class="dot"></span>
            <strong>Settings</strong>
        </div>

        <nav>
            <a class="logout" href="admin-login.html">Log out</a>

            <button id="themeToggle" class="theme" type="button"
                    aria-label="Toggle day and night theme" aria-pressed="false">
                <span class="switch"></span>
                <span id="themeLabel">Day</span>
            </button>

            <a class="home" href="admin-dashboard.html">Home</a>

            <a class="profile" href="settings.html"><b>A</b> Admin</a>
        </nav>
    </header>

    <!-- MAIN -->
    <main class="settings-main">

        <!-- CHANGE PASSWORD -->
        <section class="glass settings-card">
            <h2>Change password</h2>

            <form id="pw-form" class="card-body" novalidate>

                <p id="msg" class="msg" role="status" aria-live="polite"></p>

                <div class="form-group">
                    <label for="current">Current password</label>
                    <input type="password" id="current" name="current"
                           autocomplete="current-password">
                </div>

                <div class="form-group">
                    <label for="new">New password</label>
                    <input type="password" id="new" name="new"
                           autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirm">Confirm new password</label>
                    <input type="password" id="confirm" name="confirm"
                           autocomplete="new-password">
                </div>

                <div class="form-actions">
                    <button type="submit" class="primary-btn">Update password</button>
                </div>

            </form>
        </section>

        <!-- ADMIN ID -->
        <section class="glass settings-card">
            <h2>Admin ID</h2>

            <div class="card-body">
                <p class="admin-id-text">
                    Your admin ID is <strong id="admin-id">880005</strong> and can't be changed from here.
                </p>
            </div>
        </section>

        <!-- FOOTER -->
        <footer class="site-footer">
            <span><strong>News <em>In Green</em></strong> · Admin Settings</span>
            <span>© <span id="year"></span> News In Green</span>
        </footer>

    </main>

</body>

</html>
